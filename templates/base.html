{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Tsangarides Winery{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@shopify/buy-button-js@3.0.6/dist/buybutton.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Raleway:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --gold: #C9A84C;
            --gold-light: #E8C96A;
            --dark: #1A1208;
            --charcoal: #2C2318;
            --cream: #F5F0E8;
            --warm-white: #FAF7F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--warm-white);
            color: var(--dark);
        }

        /* ---- Topbar ---- */
        .topbar {
            background: var(--dark);
            color: #bfae94;
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            padding: 8px 48px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .topbar {
                padding: 8px 20px;
                font-size: 0.55rem;
            }
        }

        .topbar a {
            color: #bfae94;
            text-decoration: none;
            transition: color .2s;
        }

        .topbar a:hover {
            color: var(--gold-light);
        }

        /* ---- Nav ---- */
        nav {
            background: rgba(250, 247, 242, 0.97);
            backdrop-filter: blur(8px);
            padding: 18px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 200;
            border-bottom: 1px solid rgba(201, 168, 76, 0.18);
        }

        @media (max-width: 768px) {
            nav {
                padding: 14px 20px;
            }
        }

        .logo-mark {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-emblem {
            width: 52px;
            height: 52px;
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold);
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .logo-emblem {
                width: 42px;
                height: 42px;
                font-size: 1.1rem;
            }
        }

        .logo-text {
            line-height: 1.1;
        }

        .logo-text .brand {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 0.22em;
            color: var(--dark);
        }

        .logo-text .sub {
            font-family: 'Raleway', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 0.35em;
            color: #8a7a5a;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            font-family: 'Cinzel', serif;
            font-size: 0.78rem;
            letter-spacing: 0.16em;
            color: var(--charcoal);
            text-decoration: none;
            position: relative;
            padding-bottom: 3px;
            transition: color .2s;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width .3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--gold);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-dropdown {
            position: relative;
        }

        .dropdown-trigger {
            background: none;
            border: 0;
            padding: 0;
            font: inherit;
            color: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .dropdown-trigger .text {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.78rem;
            letter-spacing: 0.16em;
            color: var(--charcoal);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .dropdown-caret {
            font-size: 0.6rem;
            transition: transform .2s ease;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            min-width: 210px;
            background: #fffdf7;
            border: 1px solid rgba(201, 168, 76, 0.18);
            border-radius: 6px;
            box-shadow: 0 18px 40px rgba(26, 18, 8, 0.12);
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
            z-index: 20;
            overflow: hidden;
        }

        .dropdown-menu a {
            display: block;
            padding: 12px 16px;
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            letter-spacing: 0.18em;
            color: var(--charcoal);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .dropdown-menu a:hover {
            background: rgba(201, 168, 76, 0.08);
            color: var(--gold);
        }

        .nav-dropdown:hover .dropdown-menu,
        .nav-dropdown:focus-within .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .nav-dropdown:hover .dropdown-caret,
        .nav-dropdown:focus-within .dropdown-caret {
            transform: rotate(180deg);
        }

        @media (max-width: 1024px) {

            .nav-dropdown:hover .dropdown-menu,
            .nav-dropdown:focus-within .dropdown-menu {
                opacity: 0;
                visibility: hidden;
                transform: translateX(-50%) translateY(6px);
            }
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-right svg {
            width: 18px;
            height: 18px;
            stroke: var(--charcoal);
            cursor: pointer;
            transition: stroke .2s;
        }

        .nav-right svg:hover {
            stroke: var(--gold);
        }

        #cart-toggle-btn {
            position: relative;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cart-toggle-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--charcoal);
            transition: stroke .2s;
        }

        #cart-toggle-btn:hover svg {
            stroke: var(--gold);
        }

        #cart-item-count {
            display: none;
            position: absolute;
            top: -7px;
            right: -8px;
            background: var(--gold);
            color: var(--dark);
            font-family: 'Cinzel', serif;
            font-size: 0.5rem;
            font-weight: 700;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            line-height: 1;
            pointer-events: none;
        }

        #cart-item-count.visible {
            display: flex;
        }

        .shopify-buy__cart-toggle {
            display: none !important;
        }

        #hamburger-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            flex-direction: column;
            gap: 5px;
            justify-content: center;
        }

        #hamburger-btn span {
            display: block;
            width: 22px;
            height: 1.5px;
            background: var(--charcoal);
            transition: all .3s ease;
            transform-origin: center;
        }

        #hamburger-btn.open span:nth-child(1) {
            transform: translateY(6.5px) rotate(45deg);
        }

        #hamburger-btn.open span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        #hamburger-btn.open span:nth-child(3) {
            transform: translateY(-6.5px) rotate(-45deg);
        }

        @media (max-width: 1024px) {
            #hamburger-btn {
                display: flex;
            }

            .nav-links {
                display: none;
            }
        }

        /* ---- Mobile drawer ---- */
        #mobile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(26, 18, 8, 0.55);
            backdrop-filter: blur(3px);
            z-index: 300;
            opacity: 0;
            transition: opacity .3s ease;
        }

        #mobile-overlay.open {
            display: block;
        }

        #mobile-overlay.visible {
            opacity: 1;
        }

        #mobile-drawer {
            position: fixed;
            top: 0;
            left: 0;
            height: 100dvh;
            width: min(320px, 85vw);
            background: var(--dark);
            z-index: 400;
            transform: translateX(-100%);
            transition: transform .38s cubic-bezier(.4, 0, .2, 1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #mobile-drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 24px 28px 20px;
            border-bottom: 1px solid rgba(201, 168, 76, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .drawer-logo .brand {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 0.22em;
            color: #F5F0E8;
        }

        .drawer-logo .sub {
            font-family: 'Raleway', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 0.3em;
            color: #8a7a5a;
            text-transform: uppercase;
            margin-top: 2px;
        }

        #drawer-close {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #drawer-close svg {
            width: 18px;
            height: 18px;
            stroke: #bfae94;
            transition: stroke .2s;
        }

        #drawer-close:hover svg {
            stroke: var(--gold-light);
        }

        .drawer-nav {
            padding: 16px 0;
            margin: 8px 0px;
            flex: 1;
            flex-direction: column;
        }

        .drawer-nav a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 28px;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: #bfae94;
            text-decoration: none;
            border-bottom: 1px solid rgba(201, 168, 76, 0.08);
            transition: color .2s, background .2s;
        }

        .drawer-nav a:hover {
            color: var(--gold-light);
            background: rgba(201, 168, 76, 0.06);
        }

        .drawer-nav a .arrow {
            font-size: 0.6rem;
            color: rgba(201, 168, 76, 0.4);
            transition: color .2s;
        }

        .drawer-nav a:hover .arrow {
            color: var(--gold-light);
        }

        .drawer-parent {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: none;
            border: 0;
            padding: 14px 28px;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: #bfae94;
            text-transform: uppercase;
            cursor: pointer;
        }

        .drawer-subnav {
            padding: 0 28px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(255, 255, 255, 0.02);
        }

        .drawer-subnav a {
            padding: 10px 0;
            font-family: 'Raleway', sans-serif;
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            color: #d9c79f;
            text-transform: none;
            border-bottom: 1px solid rgba(201, 168, 76, 0.08);
        }

        .drawer-footer {
            padding: 24px 28px;
            border-top: 1px solid rgba(201, 168, 76, 0.15);
            flex-shrink: 0;
        }

        .drawer-footer-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .drawer-footer-links a {
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            letter-spacing: 0.15em;
            color: #8a7a5a;
            text-decoration: none;
            transition: color .2s;
        }

        .drawer-footer-links a:hover {
            color: var(--gold);
        }

        .drawer-copy {
            font-size: 0.62rem;
            color: #5a4c30;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.08em;
        }

        .drawer-section-label {
            padding: 16px 28px 8px;
            font-family: 'Cinzel', serif;
            font-size: 0.52rem;
            letter-spacing: 0.3em;
            color: var(--gold);
            opacity: 0.7;
        }

        /* ---- Shared buttons ---- */
        .btn-gold {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            padding: 14px 32px;
            background: var(--gold);
            color: var(--dark);
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: background .25s, transform .2s;
            display: inline-block;
            white-space: nowrap;
        }

        .btn-gold:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }

        .btn-outline {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            padding: 13px 32px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            text-decoration: none;
            transition: border-color .25s, color .25s;
            display: inline-block;
        }

        .btn-outline:hover {
            border-color: var(--gold-light);
            color: var(--gold-light);
        }

        .btn-outline-dark {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            padding: 13px 32px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            text-decoration: none;
            transition: border-color .25s, color .25s;
            display: inline-block;
            white-space: nowrap;
            margin-left: 12px;
        }

        .btn-outline-dark:hover {
            border-color: var(--gold-light);
            color: var(--gold-light);
        }

        @media (max-width: 480px) {

            .btn-gold,
            .btn-outline {
                padding: 12px 24px;
                font-size: 0.55rem;
            }

            .btn-outline-dark {
                margin-left: 0;
                margin-top: 10px;
            }
        }

        /* ---- Section rule (shared decorative divider) ---- */
        .section-rule {
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: center;
            margin-bottom: 16px;
        }

        .section-rule::before,
        .section-rule::after {
            content: '';
            flex: 1;
            max-width: 80px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold));
        }

        .section-rule::after {
            background: linear-gradient(to left, transparent, var(--gold));
        }

        .section-rule span {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            color: var(--gold);
        }

        /* ---- Footer ---- */
        footer {
            background: var(--dark);
            color: #bfae94;
        }

        .footer-top {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 48px;
            padding: 64px 80px 48px;
            border-bottom: 1px solid rgba(201, 168, 76, 0.15);
        }

        @media (max-width: 1024px) {
            .footer-top {
                grid-template-columns: 1fr 1fr;
                gap: 32px;
                padding: 48px 40px;
            }
        }

        @media (max-width: 600px) {
            .footer-top {
                grid-template-columns: 1fr;
                gap: 32px;
                padding: 40px 24px;
            }
        }

        .footer-brand p {
            font-size: 0.8rem;
            line-height: 1.7;
            color: #8a7a5a;
            margin-top: 16px;
            max-width: 280px;
        }

        .footer-col-title {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.25em;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .footer-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer-links a {
            font-size: 0.78rem;
            color: #8a7a5a;
            text-decoration: none;
            transition: color .2s;
        }

        .footer-links a:hover {
            color: var(--gold-light);
        }

        .footer-bottom {
            padding: 24px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.68rem;
            color: #5a4c30;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.1em;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-bottom a {
            color: #5a4c30;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: .6rem;
            letter-spacing: .1em;
            transition: color .2s;
        }

        .footer-bottom a:hover {
            color: var(--gold);
        }

        @media (max-width: 768px) {
            .footer-bottom {
                padding: 20px 24px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }

        /* ---- Newsletter / interest signup (footer + contextual pages) ---- */
        .newsletter-box {
            text-align: center;
            max-width: 480px;
            margin: 0 auto;
        }

        .newsletter-heading {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--gold);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .newsletter-body {
            font-size: 0.8rem;
            color: #8a7a5a;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .newsletter-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .newsletter-input {
            flex: 1 1 220px;
            padding: 12px 14px;
            border: 1px solid rgba(201, 168, 76, 0.35);
            background: #fff;
            color: var(--dark);
            font-family: 'Raleway', sans-serif;
            font-size: 0.85rem;
            outline: none;
        }

        .newsletter-submit {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            padding: 12px 24px;
            background: var(--gold);
            color: var(--dark);
            border: none;
            cursor: pointer;
            transition: background .25s;
            white-space: nowrap;
        }

        .newsletter-submit:hover {
            background: var(--gold-light);
        }

        .newsletter-submit:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .newsletter-checks {
            flex-basis: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            font-size: 0.75rem;
            color: #8a7a5a;
            margin-top: 4px;
        }

        .newsletter-checks label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .newsletter-message {
            margin-top: 14px;
            font-size: 0.8rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>

    {% block age_gate %}{% endblock %}

    {% include 'partials/header.html' %}

    {% block content %}{% endblock %}

    <div id="shopify-cart"></div>

    {% include 'partials/footer.html' %}

    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {

            // Fix header/footer copyright year everywhere it appears
            document.querySelectorAll('.year-placeholder').forEach(el => {
                el.textContent = new Date().getFullYear();
            });

            // ---- Mobile drawer (shared across every page) ----
            const hamburgerBtn = document.getElementById('hamburger-btn');
            const drawerClose = document.getElementById('drawer-close');
            const overlay = document.getElementById('mobile-overlay');
            const drawer = document.getElementById('mobile-drawer');

            function openDrawer() {
                overlay.classList.add('open');
                requestAnimationFrame(() => {
                    overlay.classList.add('visible');
                    drawer.classList.add('open');
                });
                hamburgerBtn.classList.add('open');
                hamburgerBtn.setAttribute('aria-expanded', 'true');
                drawer.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function closeDrawer() {
                overlay.classList.remove('visible');
                drawer.classList.remove('open');
                hamburgerBtn.classList.remove('open');
                hamburgerBtn.setAttribute('aria-expanded', 'false');
                drawer.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
                overlay.addEventListener('transitionend', () => overlay.classList.remove('open'), { once: true });
            }

            hamburgerBtn.addEventListener('click', openDrawer);
            drawerClose.addEventListener('click', closeDrawer);
            overlay.addEventListener('click', closeDrawer);
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
            window.addEventListener('resize', () => { if (window.innerWidth >= 1024) closeDrawer(); });

            // ---- Shopify client + cart drawer (shared across every page) ----
            const client = ShopifyBuy.buildClient({
                domain: 'tsangarideswinery.com.co',
                storefrontAccessToken: 'bbc2c3d95d8ecc7895e08d8448e7f28f',
            });
            const ui = ShopifyBuy.UI.init(client);

            function updateCartBadge(cart) {
                const badge = document.getElementById('cart-item-count');
                if (!badge) return;
                const count = cart ? cart.lineItems.reduce((sum, item) => sum + item.quantity, 0) : 0;
                badge.textContent = count;
                count > 0 ? badge.classList.add('visible') : badge.classList.remove('visible');
            }

            ui.createComponent('cart', {
                node: document.getElementById('shopify-cart'),
                options: {
                    cart: {
                        startOpen: false,
                        styles: {
                            button: {
                                'background-color': '#C9A84C',
                                'color': '#1A1208',
                                'font-family': 'Cinzel, serif',
                                ':hover': { 'background-color': '#b0923d' }
                            }
                        },
                        events: {
                            afterInit: (c) => updateCartBadge(c.model),
                            updateComplete: (c) => updateCartBadge(c.model)
                        }
                    }
                }
            });

            // Expose the shared client/ui to page-specific scripts, and let them
            // know it's safe to start using it.
            window.shopifyClient = client;
            window.shopifyUI = ui;
            window.updateCartBadge = updateCartBadge;
            document.dispatchEvent(new CustomEvent('shopify:ready'));

            // ---- Newsletter / interest signup (any number of forms per page) ----
            document.querySelectorAll('[data-newsletter-form]').forEach(function (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const box = form.closest('[data-newsletter]');
                    const messageEl = box.querySelector('[data-newsletter-message]');
                    const submitBtn = form.querySelector('.newsletter-submit');
                    const formData = new FormData(form);

                    submitBtn.disabled = true;
                    submitBtn.textContent = 'SUBMITTING…';

                    fetch("{% url 'newsletter-signup' %}", {
                        method: 'POST',
                        body: formData,
                    })
                        .then(function (res) {
                            return res.json().then(function (data) {
                                return { ok: res.ok, data: data };
                            });
                        })
                        .then(function (result) {
                            messageEl.style.display = 'block';
                            messageEl.textContent = result.data.message;
                            messageEl.style.color = result.ok ? 'var(--gold-light)' : '#b3441f';
                            if (result.ok) {
                                form.reset();
                                form.style.display = 'none';
                            }
                        })
                        .catch(function () {
                            messageEl.style.display = 'block';
                            messageEl.textContent = 'Something went wrong — please try again.';
                            messageEl.style.color = '#b3441f';
                        })
                        .finally(function () {
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'SUBSCRIBE';
                        });
                });
            });
        });
    </script>

    {% block extra_js %}{% endblock %}

</body>

</html>
