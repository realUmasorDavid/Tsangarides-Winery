<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tsangarides Winery{% endblock %}</title>
</head>

<body style="margin:0; padding:0; background-color:#FAF7F2; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
        style="background-color:#FAF7F2; padding: 32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%"
                    style="max-width:520px; background-color:#ffffff; border:1px solid rgba(201,168,76,0.25);"
                    cellpadding="0" cellspacing="0">
                    <tr>
                        <td style="background-color:#1A1208; padding:28px 32px; text-align:center;">
                            <div
                                style="font-family: Georgia, 'Times New Roman', serif; letter-spacing: 4px; font-size: 14px; color:#F5F0E8; text-transform:uppercase;">
                                TSANGARIDES</div>
                            <div
                                style="font-family: Arial, Helvetica, sans-serif; letter-spacing: 3px; font-size: 9px; color:#C9A84C; margin-top:4px; text-transform:uppercase;">
                                Wine Club</div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 36px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td
                            style="background-color:#FAF7F2; padding:24px 32px; text-align:center; border-top:1px solid rgba(201,168,76,0.2);">
                            <div
                                style="font-family: Arial, Helvetica, sans-serif; font-size: 11px; color:#8a7a5a; letter-spacing:0.5px;">
                                TSANGARIDES WINERY &middot; Lemona Village, Paphos 8545, Cyprus
                            </div>
                            <div
                                style="font-family: Arial, Helvetica, sans-serif; font-size: 11px; color:#8a7a5a; margin-top:6px;">
                                <a href="mailto:info@tsangarideswinery.com"
                                    style="color:#8a7a5a; text-decoration:underline;">info@tsangarideswinery.com</a>
                                &middot; +357 26 722 777
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
